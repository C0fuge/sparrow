name: ci

on:
  push:
  workflow_dispatch:
    inputs:
      kestrel_ref:
        description: Server commit or branch to build against (default kestrel.ref)
        required: false
        default: ''

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KESTREL_REF: ${{ inputs.kestrel_ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Resolve server ref
        id: ref
        run: |
          ref="${KESTREL_REF:-$(tr -d '[:space:]' < kestrel.ref)}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      # Dependencies, keyed by the poms; the installed server artifacts separately by the server ref.
      - name: Maven repository cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/pro/surpin
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-
      - name: Server artifacts cache
        id: kestrel-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/pro/surpin
          key: kestrel-${{ steps.ref.outputs.ref }}
      - name: Install server artifacts
        if: steps.kestrel-cache.outputs.cache-hit != 'true' || inputs.kestrel_ref != ''
        run: KESTREL_REF='${{ steps.ref.outputs.ref }}' scripts/install-kestrel.sh
      - name: Build and test
        run: ./mvnw -B -ntp verify
      - name: Checkstyle and SpotBugs
        run: ./mvnw -B -ntp -DskipTests checkstyle:check spotbugs:check
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7
